# Storage faults while writing: answers lost after the write took effect,
# and refusals, for the writer and maintenance. Every read must still be
# right. Start SILO with deploy/up.sh.
name: silo-faults
workload:
  shape: random
  values: mixed
  target: 256MiB
  batch_keys: 16
  delete_permille: 100
  rate: 12MiB
  workers: 128
readers:
  - {name: uniform, rate: 200, workers: 16, scan_ratio: 0.05, scan_limit: 100}
storage:
  bucket_url: s3://isledb?endpoint={endpoint}&region=us-east-1&use_path_style=true&request_checksum_calculation=when_required&response_checksum_validation=when_required
  endpoint: http://127.0.0.1:19000
  latency: {min: 15ms, max: 40ms}
isledb:
  readers: 1
  config:
    writer:
      memtable: {target_bytes: 3MiB}
      flush: {interval: 250ms}
phases:
  - load:
      faults:
        - after: 5s
          proxy: writer
          set: {methods: [PUT], kinds: [manifest, current], drop_rate: 0.05}
        - after: 5s
          proxy: maintenance
          set: {methods: [PUT, DELETE], error_rate: 0.05}
  - update:
      rounds: 1
      faults:
        - after: 0s
          proxy: writer
          set: {methods: [PUT], kinds: [sst], error_rate: 0.05, extra_delay: 50ms}
  - settle: {quiet: 30s, max: 10m}
  - verify: {parts: 16}
sample_every: 10s
