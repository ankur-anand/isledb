# The default profile with fewer rewrites: L0 collects about four times
# the L1 it overlaps before merging into it, and L1 is 4 GiB, which saves a
# level. Needs a version with maintenance.compaction settings.
#
# Pick the size and rate on the command line; qualify at 50 GiB first:
#
#   stress run -spec specs/bulk-load.yaml -target 50GiB -rate 24MiB -isledb origin/main -fetch
#   stress run -spec specs/bulk-load.yaml -target 1TiB  -rate 24MiB -isledb origin/main -fetch
#
# Checkpoints follow the ladder (1, 5, 10, 20, 50, 100, 250, 500 GiB, 1 TiB)
# up to the target. Start SILO with deploy/up.sh, its data on /data.
name: bulk-load
workload:
  shape: random
  values: mixed
  target: 20GiB
  batch_keys: 16
  rate: 12MiB
  # Requests in flight. Each waits about 300ms for its commit, so 256 of
  # 40KB batches allow about 32MiB/s: room for 24MiB/s when commits slow.
  workers: 256
readers:
  - {name: uniform, rate: 200, workers: 16, scan_ratio: 0.05, scan_limit: 100}
storage:
  bucket_url: s3://isledb?endpoint={endpoint}&region=us-east-1&use_path_style=true&request_checksum_calculation=when_required&response_checksum_validation=when_required
  endpoint: http://127.0.0.1:19000
  latency: {min: 15ms, max: 40ms}
  # Hold writes while the disk SILO stores on is more than 85% full. Point
  # path at that disk; where it doesn't exist, the guard warns and stays off.
  disk: {path: /data, max_used_pct: 85}
isledb:
  readers: 1
  config:
    writer:
      memtable: {target_bytes: 3MiB}
      flush: {interval: 250ms}
      # Replaced files wait this long before they are deleted. IsleDB's
      # default is 1h; 10m frees disk six times sooner, so space
      # amplification reads lower than production's would.
      policy: {max_pinned_view_age: 10m}
    maintenance:
      compaction: {l0_to_base_ratio: 4, l0_max_depth: 64, base_level_bytes: 4GiB}
phases:
  - load: {}
  - settle: {quiet: 5m, max: 3h}
  - verify: {parts: 32}
sample_every: 30s
